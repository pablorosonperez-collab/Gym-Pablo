    if(d.type==='train'||d.type==='cardio'){
      h+='<div class="lgrow">';
      h+='<div><div class="lglbl">KG</div><input type="number" class="lginp '+(exs.kg?'ok':'')+'" value="'+(exs.kg||'')+'" placeholder="0" step="0.5" onchange="logEx(\''+dk+'\',\''+ek+'\',\'kg\',this.value)"></div>';
      h+='<div><div class="lglbl">REPS</div><input type="number" class="lginp '+(exs.reps?'ok':'')+'" value="'+(exs.reps||'')+'" placeholder="0" onchange="logEx(\''+dk+'\',\''+ek+'\',\'reps\',this.value)"></div>';
      h+='<div><div class="lglbl">SERIES</div><input type="number" class="lginp '+(exs.sets?'ok':'')+'" value="'+(exs.sets||'')+'" placeholder="'+ex.sets+'" onchange="logEx(\''+dk+'\',\''+ek+'\',\'sets\',this.value)"></div></div>';
      h+='<div class="flbl">Sensacion:</div><div class="fbtns">';
      for(var fi=0;fi<fl.length;fi++){var sel=exs.feel==fi;h+='<button class="fbtn '+(sel?'sel':'')+'" style="'+(sel?'background:'+d.ac+'30;color:'+d.ac+';border-color:'+d.ac:'')+'" onclick="logFeel(\''+dk+'\',\''+ek+'\','+fi+')">'+fl[fi]+'</button>';}
      h+='</div>';
    }
    h+='</div>';
  }
  if(d.type==='train'||d.type==='cardio'){
    var done=ds.done;
    h+='<button class="donebtn" style="'+(done?'background:#1D9E75':'')+'" onclick="markDone(\''+dk+'\')">'+(done?'✅ Completado':'Marcar como completado')+'</button>';
  }
  h+='<div style="height:14px"></div>';return h;
}
function renderNutr(d,dk,ds){
  var isTrain=d.type==='train';var meals=isTrain?TM:RM;var kcal=isTrain?2900:2400;
  var tp=0,tc=0,tf=0;
  for(var i=0;i<meals.length;i++){tp+=meals[i].mp.p;tc+=meals[i].mp.c;tf+=meals[i].mp.f;}
  var h='';
  h+='<div class="card"><div class="clbl">DIA DE '+(isTrain?'ENTRENO':'DESCANSO')+'</div>';
  h+='<div style="font-size:24px;font-weight:700;color:#00E5FF;margin-bottom:10px">'+kcal.toLocaleString()+' kcal</div>';
  h+='<div class="macrow"><div class="mc" style="background:#1D9E7520"><div class="mv" style="color:#1D9E75">'+tp+'g</div><div class="mlbls">PROTEINA</div></div>';
  h+='<div class="mc" style="background:#D85A3020"><div class="mv" style="color:#D85A30">'+tc+'g</div><div class="mlbls">HIDRATOS</div></div>';
  h+='<div class="mc" style="background:#BA751720"><div class="mv" style="color:#BA7517">'+tf+'g</div><div class="mlbls">GRASAS</div></div></div></div>';
  for(var i=0;i<meals.length;i++){
    var m=meals[i];var mk=dk+'_m'+i;var open=!!openM[mk];var fv=(ds.food&&ds.food['m'+i])||'';
    h+='<div class="mealc"><div class="mealh" onclick="toggleM(\''+mk+'\')">';
    h+='<div style="flex:1"><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px">';
    h+='<span style="font-size:12px;font-weight:700;color:#00E5FF">'+m.time+'</span>';
    h+='<span style="font-size:12px;font-weight:600">'+m.name+'</span>';
    h+='<span class="mtag" style="background:'+m.tbg+';color:'+m.tc+'">'+m.tag+'</span></div>';
    h+='<div style="font-size:11px;color:#8B8FA8;margin-bottom:5px;line-height:1.4">'+m.detail+'</div>';
    h+='<div><span class="mm" style="background:#1D9E7520;color:#1D9E75">'+m.mp.p+'g prot</span>';
    h+='<span class="mm" style="background:#D85A3020;color:#D85A30">'+m.mp.c+'g hid</span>';
    h+='<span class="mm" style="background:#BA751720;color:#BA7517">'+m.mp.f+'g gras</span>';
    h+='<span style="font-size:10px;color:#6b6b8a;padding:1px 5px">'+m.mp.k+' kcal</span></div></div>';
    h+='<div class="chv '+(open?'o':'')+'">&#9662;</div></div>';
    if(open){
      h+='<div class="maalt"><div style="font-size:9px;color:#6b6b8a;letter-spacing:1px;margin-bottom:5px">ALTERNATIVA</div>';
      h+='<div style="font-size:11px;color:#8B8FA8;margin-bottom:6px;line-height:1.4">'+m.alt.detail+'</div>';
      h+='<span class="mm" style="background:#1D9E7520;color:#1D9E75">'+m.alt.mp.p+'g prot</span>';
      h+='<span class="mm" style="background:#D85A3020;color:#D85A30">'+m.alt.mp.c+'g hid</span>';
      h+='<span class="mm" style="background:#BA751720;color:#BA7517">'+m.alt.mp.f+'g gras</span></div>';
    }
    h+='<div style="padding:8px 12px 10px;border-top:1px solid #1a1a35">';
    h+='<div style="font-size:9px;color:#6b6b8a;letter-spacing:1px;margin-bottom:4px">LO QUE COMISTE</div>';
    h+='<textarea class="finp '+(fv?'ok':'')+'" rows="2" placeholder="Ej: pollo 150g, arroz 100g..." onchange="logFood(\''+dk+'\','+i+',this.value)">'+fv+'</textarea></div>';
    h+='</div>';
  }
  h+='<div style="height:14px"></div>';return h;
}
function toggleM(k){openM[k]=!openM[k];renderDay();}
function logEx(dk,ek,f,v){if(!state[dk])state[dk]={done:false,exercises:{},food:{}};if(!state[dk].exercises[ek])state[dk].exercises[ek]={};state[dk].exercises[ek][f]=v;ss();}
function logFeel(dk,ek,v){if(!state[dk])state[dk]={done:false,exercises:{},food:{}};if(!state[dk].exercises[ek])state[dk].exercises[ek]={};state[dk].exercises[ek].feel=v;ss();renderDay();}
function logFood(dk,mi,v){if(!state[dk])state[dk]={done:false,exercises:{},food:{}};if(!state[dk].food)state[dk].food={};state[dk].food['m'+mi]=v;ss();}
function markDone(dk){if(!state[dk])state[dk]={done:false,exercises:{},food:{}};state[dk].done=!state[dk].done;ss();toast(state[dk].done?'Sesion completada!':'Marcado como pendiente');renderNav();renderDay();}
function renderProg(){
  var p=state.progress||{};var h='';
  h+='<div class="card"><div class="clbl">DATOS CORPORALES SEMANA 1</div>';
  h+='<div class="g2"><div class="ig"><label class="ilbl">PESO LUNES kg</label><input type="number" class="inp" id="pw1" step="0.1" placeholder="77.3" value="'+(p.w1||'')+'"></div>';
  h+='<div class="ig"><label class="ilbl">PESO VIERNES kg</label><input type="number" class="inp" id="pw2" step="0.1" placeholder="77.3" value="'+(p.w2||'')+'"></div></div>';
  h+='<div class="g3"><div class="ig"><label class="ilbl">% GRASA</label><input type="number" class="inp" id="pfat" step="0.1" placeholder="18.0" value="'+(p.fat||'')+'"></div>';
  h+='<div class="ig"><label class="ilbl">MUSCULO kg</label><input type="number" class="inp" id="pmu" step="0.1" placeholder="38.0" value="'+(p.muscle||'')+'"></div>';
  h+='<div class="ig"><label class="ilbl">AGUA %</label><input type="number" class="inp" id="pwa" step="0.1" placeholder="55.0" value="'+(p.water||'')+'"></div></div>';
  h+='<div class="g3"><div class="ig"><label class="ilbl">SUENO h</label><input type="number" class="inp" id="psl" step="0.5" placeholder="7.5" value="'+(p.sleep||'')+'"></div>';
  h+='<div class="ig"><label class="ilbl">DIAS GYM</label><select class="inp" id="pdy"><option value="">-</option>';
  for(var i=1;i<=5;i++)h+='<option '+(p.days==i?'selected':'')+'>'+i+'</option>';
  h+='</select></div><div class="ig"><label class="ilbl">DIETA</label><select class="inp" id="pdi"><option value="">-</option>';
  var dl=['Muy mala','Mala','Regular','Buena','Perfecta'];
  for(var i=0;i<dl.length;i++)h+='<option value="'+(i+1)+'" '+(p.diet==(i+1)?'selected':'')+'>'+dl[i]+'</option>';
  h+='</select></div></div>';
  h+='<div class="ig"><label class="ilbl">NOTAS</label><textarea class="inp" id="pno" rows="2" placeholder="Lesiones, viajes, como te has sentido...">'+(p.notes||'')+'</textarea></div>';
  h+='<button class="sbtn" onclick="saveProg()">Guardar datos</button></div>';
  if(p.w1||p.fat||p.muscle){
    h+='<div class="clbl" style="padding:0 0 8px">KPIs SEMANA 1</div><div class="kgrid">';
    var wa=p.w1&&p.w2?((parseFloat(p.w1)+parseFloat(p.w2))/2).toFixed(1):(p.w1||'-');
    var wd=p.w1&&p.w2?(parseFloat(p.w2)-parseFloat(p.w1)).toFixed(1):null;
    var wc=wd?(Math.abs(parseFloat(wd))<0.3?'#8B8FA8':parseFloat(wd)>0.6?'#D85A30':'#1D9E75'):'#8B8FA8';
    h+='<div class="kpi"><div class="kv" style="color:#00E5FF">'+wa+'<span style="font-size:12px">kg</span></div><div class="kl">PESO MEDIO</div>'+(wd?'<div class="kd" style="color:'+wc+'">'+(parseFloat(wd)>=0?'+':'')+wd+'kg</div>':'')+'</div>';
    if(p.fat)h+='<div class="kpi"><div class="kv" style="color:#D85A30">'+p.fat+'<span style="font-size:12px">%</span></div><div class="kl">% GRASA</div><div class="kd" style="color:#8B8FA8">Obj: 12%</div></div>';
    if(p.muscle)h+='<div class="kpi"><div class="kv" style="color:#1D9E75">'+p.muscle+'<span style="font-size:12px">kg</span></div><div class="kl">MUSCULO</div><div class="kd" style="color:#8B8FA8">Obj: +2kg</div></div>';
    if(p.sleep){var sc=parseFloat(p.sleep)>=7.5?'#1D9E75':parseFloat(p.sleep)>=6.5?'#BA7517':'#D85A30';h+='<div class="kpi"><div class="kv" style="color:'+sc+'">'+p.sleep+'<span style="font-size:12px">h</span></div><div class="kl">SUENO</div><div class="kd" style="color:'+sc+'">'+(parseFloat(p.sleep)>=7?'Optimo':'Mejorar')+'</div></div>';}
    h+='</div><div class="card"><div class="clbl">INDICADORES</div>';
    var dn=parseInt(p.days)||0;
    h+='<div class="bw"><div class="bl"><span>Dias entrenados</span><span>'+dn+'/4</span></div><div class="bt"><div class="bf" style="width:'+Math.round(dn/4*100)+'%;background:'+(dn>=4?'#1D9E75':dn>=3?'#BA7517':'#D85A30')+'"></div></div></div>';
    var din=parseInt(p.diet)||0;var dilab=['','Muy mala','Mala','Regular','Buena','Perfecta'][din]||'-';
    h+='<div class="bw"><div class="bl"><span>Adherencia dieta</span><span>'+dilab+'</span></div><div class="bt"><div class="bf" style="width:'+Math.round(din/5*100)+'%;background:'+(din>=4?'#1D9E75':din>=3?'#BA7517':'#D85A30')+'"></div></div></div>';
    var sl=parseFloat(p.sleep)||0;
    h+='<div class="bw"><div class="bl"><span>Calidad sueno</span><span>'+(sl||'-')+'h</span></div><div class="bt"><div class="bf" style="width:'+Math.min(Math.round(sl/9*100),100)+'%;background:'+(sl>=7.5?'#1D9E75':sl>=6.5?'#BA7517':'#D85A30')+'"></div></div></div></div>';
    h+='<div class="card"><div class="clbl">ANALISIS</div>';
    var fb=buildFB(p);for(var i=0;i<fb.length;i++)h+='<div class="fbi" style="background:'+fb[i].bg+';color:'+fb[i].c+'">'+fb[i].t+'</div>';
    h+='</div>';
  }
  var tdays=[];for(var i=0;i<DAYS.length;i++){if(DAYS[i].type==='train')tdays.push(DAYS[i]);}
  h+='<div class="card"><div class="clbl">SESIONES</div>';
  for(var i=0;i<tdays.length;i++){var d=tdays[i];var done=state[d.id]&&state[d.id].done;h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1a1a35"><div><div style="font-size:12px;font-weight:600;color:'+(done?'#fff':'#6b6b8a')+'">'+d.label+'</div><div style="font-size:10px;color:#6b6b8a">'+d.focus+'</div></div><div style="font-size:16px">'+(done?'✅':'⬜')+'</div></div>';}
  h+='</div>';
  h+='<div class="card"><div class="clbl">ENVIAR A CLAUDE</div>';
  h+='<div style="font-size:11px;color:#8B8FA8;margin-bottom:10px;line-height:1.6">Al final de la semana genera el resumen y pegalo en Claude para recibir el plan de la semana siguiente.</div>';
  h+='<button class="sbtn" onclick="genExport()">Generar resumen semanal</button>';
  h+='<div id="expbox"></div></div>';
  document.getElementById('progcontent').innerHTML=h;
}
function buildFB(p){
  var fb=[];var w1=parseFloat(p.w1),w2=parseFloat(p.w2);
  if(w1&&w2){var d=w2-w1;if(d>0.6)fb.push({bg:'#D85A3020',c:'#D85A30',t:'Has subido '+d.toFixed(1)+'kg. Si la grasa tambien sube revisa las calorias en dias de descanso.'});else if(d<-0.7)fb.push({bg:'#D85A3020',c:'#D85A30',t:'Has bajado '+Math.abs(d).toFixed(1)+'kg. Puede ser deficit demasiado agresivo.'});else fb.push({bg:'#1D9E7520',c:'#1D9E75',t:'Peso estable ('+(d>=0?'+':'')+d.toFixed(1)+'kg). Para recomposicion corporal esto es ideal.'});}
  var sl=parseFloat(p.sleep);if(sl&&sl<7)fb.push({bg:'#D85A3020',c:'#D85A30',t:'Sueno por debajo de 7h. El cortisol elevado frena la sintesis muscular.'});else if(sl&&sl>=7.5)fb.push({bg:'#1D9E7520',c:'#1D9E75',t:'Buen sueno ('+sl+'h). Clave para la recuperacion muscular.'});
  var di=parseInt(p.diet);if(di&&di<=2)fb.push({bg:'#D85A3020',c:'#D85A30',t:'Adherencia a la dieta baja. Sin 180g de proteina diarios la recomposicion no funciona.'});else if(di&&di>=4)fb.push({bg:'#1D9E7520',c:'#1D9E75',t:'Buena adherencia. Esto marca la diferencia para llegar definido en agosto.'});
  var dn=parseInt(p.days);if(dn&&dn<3)fb.push({bg:'#BA751720',c:'#BA7517',t:'Solo '+dn+' dias de entreno. Necesitas 4 dias semanales para el objetivo de agosto.'});else if(dn&&dn>=4)fb.push({bg:'#1D9E7520',c:'#1D9E75',t:'Semana completa con '+dn+' dias. Exactamente lo que necesitas.'});
  if(!fb.length)fb.push({bg:'#378ADD20',c:'#378ADD',t:'Rellena los datos y guarda para ver el analisis.'});
  return fb;
}
function saveProg(){state.progress={w1:document.getElementById('pw1').value,w2:document.getElementById('pw2').value,fat:document.getElementById('pfat').value,muscle:document.getElementById('pmu').value,water:document.getElementById('pwa').value,sleep:document.getElementById('psl').value,days:document.getElementById('pdy').value,diet:document.getElementById('pdi').value,notes:document.getElementById('pno').value};ss();toast('Datos guardados');renderProg();}
function genExport(){
  var p=state.progress||{};var dl=['','Muy mala','Mala','Regular','Buena','Perfecta'];var fl=['Mal','Ok','Bien','Top'];
  var lines=['=== GYMPLAN SEMANA 1 PABLO ===',''];
  lines.push('DATOS CORPORALES:');
  if(p.w1)lines.push('Peso inicio: '+p.w1+'kg');if(p.w2)lines.push('Peso fin: '+p.w2+'kg');if(p.fat)lines.push('Grasa: '+p.fat+'%');if(p.muscle)lines.push('Musculo: '+p.muscle+'kg');if(p.water)lines.push('Agua: '+p.water+'%');if(p.sleep)lines.push('Sueno: '+p.sleep+'h');if(p.days)lines.push('Dias entrenados: '+p.days);if(p.diet)lines.push('Dieta: '+dl[parseInt(p.diet)]);if(p.notes)lines.push('Notas: '+p.notes);
  lines.push('');lines.push('ENTRENAMIENTOS:');
  for(var di=0;di<DAYS.length;di++){var d=DAYS[di];if(d.type!=='train')continue;var ds=state[d.id];if(!ds)continue;lines.push('');lines.push(d.label+' - '+d.focus+(ds.done?' COMPLETADO':' NO COMPLETADO'));for(var ei=0;ei<d.training.length;ei++){var ex=d.training[ei];var ek='ex'+ei;var exs=ds.exercises&&ds.exercises[ek];if(exs&&(exs.kg||exs.reps)){var feel=exs.feel!==undefined?fl[exs.feel]:'-';lines.push('  '+ex.ex+': '+(exs.kg?exs.kg+'kg ':'')+( exs.reps?exs.reps+' reps ':'')+( exs.sets?exs.sets+' series':'')+'| '+feel);}}if(ds.food){var meals=TM;for(var mi=0;mi<meals.length;mi++){if(ds.food['m'+mi])lines.push('  Comida '+meals[mi].time+': '+ds.food['m'+mi]);}}}
  var txt=lines.join('\n');var box=document.getElementById('expbox');
  box.innerHTML='<div class="expbox" id="etxt">'+txt+'</div><button class="sbtn" style="margin-top:8px" onclick="copyExp()">Copiar y pegar en Claude</button>';
}
function copyExp(){var txt=document.getElementById('etxt').textContent;if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('Copiado. Pegalo en Claude.');}).catch(function(){toast('Selecciona el texto manualmente',false);});}else{toast('Selecciona el texto manualmente',false);}}
function toast(msg,ok){if(ok===undefined)ok=true;var t=document.getElementById('toast');t.textContent=msg;t.style.background=ok?'#1D9E75':'#D85A30';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
renderNav();renderDay();
</script>
</body>
</html>
